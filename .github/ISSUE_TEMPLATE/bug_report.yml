name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link in SECURITY.md. Never include real passwords, tokens or private keys."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the tool URL and a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version and commit if self-hosted.
    validations:
      required: true
